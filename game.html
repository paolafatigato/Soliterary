<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soliterary · Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="btn app-home" href="index.html" id="homeBtn" title="Back to the home"><i>🏠</i><span class="lbl">Home</span></a>
    <a class="brand" href="index.html" title="Back to the home">Soli<span>terary</span></a>
    <div class="stats" id="stats"></div>
    <div class="appbtns">
      <button class="btn" data-action="stories" title="My stories"><i>📖</i><span class="lbl">My stories</span></button>
      <button class="btn" data-action="rules" title="How to play"><i>❓</i><span class="lbl">Rules</span></button>
      <button class="btn" id="accountBtn">👤 Sign in</button>
    </div>
  </header>


  <main class="table" id="table">
    <div class="board" id="board"></div>
  </main>

  <div class="msg" id="msg"></div>
  <div class="reader" id="reader"></div>

  <!-- the buttons of the GAME (the top bar has the ones of the app) -->
  <nav class="dock" aria-label="Game controls">
    <button data-action="undo" id="undoBtn"><i>↶</i>Undo</button>
    <button data-action="hint" class="d-hint"><i>💡</i>Hint</button>
    <button data-action="again"><i>🔄</i>Deal again</button>
    <button data-action="new" class="d-new"><i>🎲</i>New stories</button>
  </nav>

  <aside class="drawer" id="drawer">
    <button class="btn close" data-action="stories">✕</button>
    <h2>My stories</h2>
    <div id="drawerBody"></div>
  </aside>

  <div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>

  <script src="stories.js"></script>
  <script src="levels.js"></script>
  <script src="classics.js"></script>
  <script src="chapters.js"></script>
  <script src="giulia.js"></script>
  <script src="catalog.js"></script>
  <script src="progress.js"></script>
  <script src="grammar.js"></script>
  <script src="engine.js"></script>
  <script src="script.js"></script>
  <script type="module" src="cloud.js"></script>
  <script type="module" src="net.js"></script>
</body>
</html>
